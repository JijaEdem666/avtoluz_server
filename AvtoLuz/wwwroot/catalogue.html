<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="style_catalogue.css"/>
    <title>АвтоЛуз - Каталог автомобилей</title>
    <style>
        #load-more-sentinel { height: 1px; }

        .loader {
            display: none;
            grid-column: 1 / -1;
            text-align: center;
            padding: 32px;
            font-size: 15px;
            color: #666;
        }
        .loader.visible { display: block; }
        .loader-spinner {
            display: inline-block;
            width: 32px; height: 32px;
            border: 3px solid #e0e0e0;
            border-top-color: #c0392b;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .end-message {
            display: none;
            grid-column: 1 / -1;
            text-align: center;
            padding: 24px;
            color: #999;
            font-size: 14px;
        }
        .end-message.visible { display: block; }

        .sort-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .sort-bar label { font-weight: 600; font-size: 14px; color: #444; }
        .sort-select {
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            background: #fff;
        }
        .sort-select:focus { outline: none; border-color: #c0392b; }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
        }
        .no-results svg { width: 64px; opacity: .3; margin-bottom: 12px; }
        .no-results p { color: #888; font-size: 15px; margin: 0; }

        /* Подсветка кнопки избранного при активации */
        .add-favorite.active { color: #c0392b; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="logo.png" width="100" height="50" alt="Логотип"/>
        </a>
        <nav>
            <a href="about.html">О нас</a>
            <a href="catalogue.html">Каталог</a>
            <a href="terms.html">Условия покупки</a>
            <a href="favourites-page.html">Избранное</a>
            <a href="contacts.html">Контакты</a>
            <a href="admin_catalog.html">Добавить автомобиль</a>
        </nav>
    </header>

    <main>
        <h1 class="filters-title">Подбор автомобиля по параметрам</h1>

        <form id="filters-form" class="filters-container">
            <div class="filter-group">
                <label for="brand-select" class="filter-label">Марка автомобиля</label>
                <select id="brand-select" name="brand" class="filter-select">
                    <option value="">Все марки</option>
                    <option value="BMW">BMW</option>
                    <option value="Mercedes-Benz">Mercedes-Benz</option>
                    <option value="Audi">Audi</option>
                    <option value="Toyota">Toyota</option>
                    <option value="Honda">Honda</option>
                    <option value="Ford">Ford</option>
                    <option value="Lada">Lada</option>
                    <option value="Volkswagen">Volkswagen</option>
                    <option value="Nissan">Nissan</option>
                    <option value="Hyundai">Hyundai</option>
                    <option value="Kia">Kia</option>
                    <option value="Renault">Renault</option>
                    <option value="Chevrolet">Chevrolet</option>
                    <option value="Skoda">Skoda</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="body-select" class="filter-label">Тип кузова</label>
                <select id="body-select" name="bodyType" class="filter-select">
                    <option value="">Все типы</option>
                    <option value="sedan">Седан</option>
                    <option value="hatchback">Хэтчбек</option>
                    <option value="suv">Внедорожник</option>
                    <option value="coupe">Купе</option>
                    <option value="wagon">Универсал</option>
                    <option value="minivan">Минивэн</option>
                    <option value="convertible">Кабриолет</option>
                    <option value="pickup">Пикап</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="engine-select" class="filter-label">Тип топлива</label>
                <select id="engine-select" name="fuelType" class="filter-select">
                    <option value="">Все типы</option>
                    <option value="petrol">Бензиновый</option>
                    <option value="diesel">Дизельный</option>
                    <option value="hybrid">Гибридный</option>
                    <option value="electric">Электрический</option>
                    <option value="gas">Газовый</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="transmission-select" class="filter-label">Коробка передач</label>
                <select id="transmission-select" name="transmission" class="filter-select">
                    <option value="">Все типы</option>
                    <option value="automatic">Автоматическая</option>
                    <option value="manual">Механическая</option>
                    <option value="robot">Роботизированная</option>
                    <option value="variator">Вариатор</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="drive-select" class="filter-label">Привод</label>
                <select id="drive-select" name="driveType" class="filter-select">
                    <option value="">Любой</option>
                    <option value="front">Передний</option>
                    <option value="rear">Задний</option>
                    <option value="all">Полный</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="steering-select" class="filter-label">Руль</label>
                <select id="steering-select" name="steering" class="filter-select">
                    <option value="">Любой</option>
                    <option value="left">Левый</option>
                    <option value="right">Правый</option>
                </select>
            </div>

            <button type="submit" class="search-button">Найти автомобили</button>
        </form>

        <div class="results-section">
            <div class="sort-bar">
                <p class="results-title" id="results-title">Наши автомобили</p>
                <label for="sort-select">Сортировка:</label>
                <select id="sort-select" class="sort-select">
                    <option value="id_asc">По умолчанию</option>
                    <option value="price_asc">Цена ↑</option>
                    <option value="price_desc">Цена ↓</option>
                    <option value="year_desc">Новее</option>
                    <option value="mileage_asc">Пробег ↑</option>
                </select>
            </div>

            <div id="cars-container" class="cars-grid"></div>

            <div id="loader" class="loader">
                <span class="loader-spinner"></span> Загружаем ещё...
            </div>
            <div id="end-message" class="end-message">
                — Все автомобили загружены —
            </div>
            <div id="load-more-sentinel"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 Автомобильный агрегатор "АвтоЛуз". Все права защищены.
            Email: <a href="/cdn-cgi/l/email-protection#6a03040c052a0b1c1e05061f1044181f"><span class="__cf_email__" data-cfemail="b6dfd8d0d9f6d7c0c2d9dac3cc98c4c3">[email&#160;protected]</span></a></p>
    </footer>


    <script>
    (() => {
        'use strict';

        /* ════════════════════════════════════════════
         * Конфигурация
         * ════════════════════════════════════════════ */
        var API_BASE  = '/api/cars';
        var PAGE_SIZE = 8;

        /* ════════════════════════════════════════════
         * Состояние приложения
         * ════════════════════════════════════════════ */
        var currentPage   = 1;
        var totalPages    = 1;
        var isLoading     = false;
        var activeFilters = {};
        var activeSort    = 'id_asc';

        /* DOM-узлы */
        var container  = document.getElementById('cars-container');
        var loader     = document.getElementById('loader');
        var endMessage = document.getElementById('end-message');
        var sentinel   = document.getElementById('load-more-sentinel');
        var titleEl    = document.getElementById('results-title');
        var form       = document.getElementById('filters-form');
        var sortSelect = document.getElementById('sort-select');

        /* ════════════════════════════════════════════
         * AJAX — загрузка автомобилей через XMLHttpRequest
         * ════════════════════════════════════════════ */

        /**
         * Отправляет GET-запрос к /api/cars с фильтрами и пагинацией.
         * Результат передаётся в коллбэк onSuccess(data) или onError(statusCode).
         *
         * @param {Object}   filters   — активные фильтры (brand, bodyType, ...)
         * @param {string}   sort      — ключ сортировки
         * @param {number}   page      — номер страницы
         * @param {Function} onSuccess — вызывается с распарсенным JSON
         * @param {Function} onError   — вызывается при ошибке
         */
        function ajaxGetCars(filters, sort, page, onSuccess, onError) {
            /* Собираем строку запроса */
            var params = buildQueryString(filters, sort, page);
            var url    = API_BASE + '?' + params;

            /* Создаём объект XMLHttpRequest */
            var xhr = new XMLHttpRequest();

            /*
             * readystatechange — срабатывает при каждом изменении readyState:
             *   0 UNSENT        — объект создан
             *   1 OPENED        — open() вызван
             *   2 HEADERS_RECEIVED — заголовки получены
             *   3 LOADING       — тело приходит по частям
             *   4 DONE          — ответ получен полностью
             */
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== XMLHttpRequest.DONE) {
                    return; /* ещё не готово */
                }

                if (xhr.status >= 200 && xhr.status < 300) {
                    /* Успех: парсим JSON и передаём в колбэк */
                    var data;
                    try {
                        data = JSON.parse(xhr.responseText);
                    } catch (e) {
                        onError('Ошибка разбора JSON: ' + e.message);
                        return;
                    }
                    onSuccess(data);
                } else {
                    /* Сервер вернул ошибку */
                    onError('HTTP ' + xhr.status + ': ' + xhr.statusText);
                }
            };

            /* Обработчик сетевой ошибки (нет соединения, CORS и т.д.) */
            xhr.onerror = function () {
                onError('Сетевая ошибка. Проверьте, запущен ли сервер.');
            };

            /* Обработчик таймаута */
            xhr.ontimeout = function () {
                onError('Время ожидания ответа истекло.');
            };

            xhr.timeout = 10000; /* 10 секунд */

            /* Открываем соединение и отправляем запрос */
            xhr.open('GET', url, /* async = */ true);
            xhr.setRequestHeader('Accept', 'application/json');
            xhr.send();
        }

        /**
         * Формирует строку query-параметров из фильтров, сортировки и номера страницы.
         * Пустые значения не включаются.
         */
        function buildQueryString(filters, sort, page) {
            var parts = [];

            for (var key in filters) {
                if (filters.hasOwnProperty(key) && filters[key]) {
                    parts.push(
                        encodeURIComponent(key) + '=' + encodeURIComponent(filters[key])
                    );
                }
            }

            parts.push('sort='  + encodeURIComponent(sort));
            parts.push('page='  + encodeURIComponent(page));
            parts.push('limit=' + encodeURIComponent(PAGE_SIZE));

            return parts.join('&');
        }

        /* ════════════════════════════════════════════
         * Рендер карточки автомобиля
         * ════════════════════════════════════════════ */

        function renderCard(car) {
            var card       = document.createElement('div');
            card.className = 'car-card';

            card.innerHTML =
                '<img src="' + escHtml(car.image || '') + '"' +
                '     alt="' + escHtml(car.brand + ' ' + car.model) + '"' +
                '     height="200" class="car-image"' +
                '     onerror="this.src=\'placeholder.png\'"/>' +
                '<div class="car-info">' +
                    '<button class="add-favorite" title="Добавить в избранное"' +
                            ' data-id="' + car.id + '">&#9829;</button>' +
                    '<p class="car-title">' + escHtml(car.brand + ' ' + car.model) + '</p>' +
                    '<div class="car-details">' +
                        '<span class="car-year">'  + escHtml(String(car.year))  + ' год</span>' +
                        '<span class="car-price">' + car.price.toLocaleString('ru-RU') + ' &#8381;</span>' +
                    '</div>' +
                    '<div class="car-details" style="margin-top:4px;font-size:13px;color:#777;">' +
                        '<span>Пробег: ' + car.mileage.toLocaleString('ru-RU') + ' км</span>' +
                        (car.power ? '<span>' + car.power + ' л.с.</span>' : '') +
                    '</div>' +
                    '<div class="car-features">' +
                        '<span class="car-feature">' + (BODY_LABELS[car.bodyType]     || car.bodyType)     + '</span>' +
                        '<span class="car-feature">' + (FUEL_LABELS[car.fuelType]     || car.fuelType)     + '</span>' +
                        '<span class="car-feature">' + (TX_LABELS[car.transmission]   || car.transmission) + '</span>' +
                        '<span class="car-feature">' + (DRIVE_LABELS[car.driveType]   || car.driveType)    + '</span>' +
                    '</div>' +
                    '<button class="car-button" onclick="goToCarDetails(' + car.id + ')">Подробнее</button>' +
                '</div>';

            return card;
        }

        /* Экранирование HTML во избежание XSS */
        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        /* ════════════════════════════════════════════
         * Загрузка страницы результатов
         * ════════════════════════════════════════════ */

        function loadPage(page) {
            if (isLoading) return;

            isLoading = true;
            loader.classList.add('visible');
            endMessage.classList.remove('visible');

            ajaxGetCars(
                activeFilters,
                activeSort,
                page,

                /* onSuccess */
                function (result) {
                    isLoading  = false;
                    totalPages = result.pages;

                    loader.classList.remove('visible');

                    /* Первая страница — полностью перерисовываем список */
                    if (page === 1) {
                        container.innerHTML = '';
                        titleEl.textContent = 'Наши автомобили (' + result.total + ')';

                        if (result.data.length === 0) {
                            container.innerHTML =
                                '<div class="no-results">' +
                                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
                                        '<circle cx="11" cy="11" r="8"/>' +
                                        '<path d="M21 21l-4.35-4.35"/>' +
                                        '<line x1="8" y1="11" x2="14" y2="11"/>' +
                                    '</svg>' +
                                    '<p>По вашему запросу ничего не найдено.<br>' +
                                       'Попробуйте изменить параметры фильтрации.</p>' +
                                '</div>';
                            return;
                        }
                    }

                    /* Добавляем карточки следующей страницы */
                    for (var i = 0; i < result.data.length; i++) {
                        container.appendChild(renderCard(result.data[i]));
                    }

                    syncFavoriteButtons();
                    currentPage = page;

                    if (page >= totalPages && result.total > 0) {
                        endMessage.classList.add('visible');
                    }
                },

                /* onError */
                function (errMsg) {
                    isLoading = false;
                    loader.classList.remove('visible');
                    console.error('AJAX-ошибка:', errMsg);

                    if (page === 1) {
                        container.innerHTML =
                            '<div class="no-results">' +
                                '<p>&#9888;&#65039; Не удалось загрузить данные.<br>' +
                                   'Убедитесь, что сервер запущен (<code>dotnet run</code>).</p>' +
                            '</div>';
                    }
                }
            );
        }

        /* ════════════════════════════════════════════
         * Сброс фильтров и перезагрузка с 1-й страницы
         * ════════════════════════════════════════════ */

        function reloadFromStart() {
            currentPage = 1;
            totalPages  = 1;
            loadPage(1);
        }

        /* ════════════════════════════════════════════
         * Бесконечная прокрутка — IntersectionObserver
         * Когда sentinel-элемент в конце списка попадает
         * в область видимости — подгружаем следующую страницу
         * ════════════════════════════════════════════ */

        var scrollObserver = new IntersectionObserver(
            function (entries) {
                if (entries[0].isIntersecting && !isLoading && currentPage < totalPages) {
                    loadPage(currentPage + 1);
                }
            },
            { rootMargin: '200px' }
        );

        scrollObserver.observe(sentinel);

        /* ════════════════════════════════════════════
         * Обработчики событий формы и сортировки
         * ════════════════════════════════════════════ */

        form.addEventListener('submit', function (e) {
            e.preventDefault(); /* Отменяем стандартную отправку формы */

            /* Собираем фильтры из полей формы */
            activeFilters = {};
            var elements = form.elements;
            for (var i = 0; i < elements.length; i++) {
                var el = elements[i];
                if (el.name && el.value) {
                    activeFilters[el.name] = el.value;
                }
            }

            reloadFromStart();
        });

        sortSelect.addEventListener('change', function () {
            activeSort = sortSelect.value;
            reloadFromStart();
        });

        /* ════════════════════════════════════════════
         * Избранное — AJAX через XMLHttpRequest
         *
         * Session ID хранится в localStorage и передаётся
         * в заголовке X-Session-Id при каждом запросе.
         * favouriteIds — локальный кэш id избранных авто,
         * синхронизируется с сервером после каждого действия.
         * ════════════════════════════════════════════ */

        var favouriteIds = [];

        function getSessionId() {
            var key = 'avtoluz_session_id';
            var id  = localStorage.getItem(key);
            if (!id) {
                id = 'sess-' + Date.now().toString(36) + '-' +
                     Math.random().toString(36).slice(2, 10);
                localStorage.setItem(key, id);
            }
            return id;
        }

        function ajaxFav(method, url, onSuccess, onError) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== XMLHttpRequest.DONE) return;
                if (xhr.status >= 200 && xhr.status < 300) {
                    try { onSuccess(JSON.parse(xhr.responseText)); }
                    catch (e) { onError(e.message); }
                } else { onError('HTTP ' + xhr.status); }
            };
            xhr.onerror   = function () { onError('\u0421\u0435\u0442\u0435\u0432\u0430\u044f \u043e\u0448\u0438\u0431\u043a\u0430'); };
            xhr.ontimeout = function () { onError('\u0422\u0430\u0439\u043c\u0430\u0443\u0442'); };
            xhr.timeout = 10000;
            var sep = url.indexOf('?') === -1 ? '?' : '&';
            xhr.open(method, url + sep + 'sid=' + encodeURIComponent(getSessionId()), true);
            xhr.setRequestHeader('Accept', 'application/json');
            xhr.send();
        }

        /* Загрузить id избранных с сервера и подсветить кнопки ♥ */
        function syncFavoriteButtons() {
            /*
             * AJAX GET /api/favourites/ids
             * Возвращает массив car_id для текущей сессии
             */
            ajaxFav(
                'GET',
                '/api/favourites/ids',
                function (ids) {
                    favouriteIds = ids || [];
                    var buttons = document.querySelectorAll('.add-favorite');
                    for (var i = 0; i < buttons.length; i++) {
                        var btn   = buttons[i];
                        var id    = Number(btn.dataset.id);
                        var isFav = favouriteIds.indexOf(id) !== -1;
                        btn.classList.toggle('active', isFav);
                        btn.title = isFav ? 'Убрать из избранного' : 'Добавить в избранное';
                    }
                },
                function (err) { console.warn('Не удалось загрузить избранное:', err); }
            );
        }

        /* Делегирование клика на кнопку ♥ */
        document.addEventListener('click', function (e) {
            if (!e.target.classList.contains('add-favorite')) return;

            var btn   = e.target;
            var carId = Number(btn.dataset.id);
            var isFav = favouriteIds.indexOf(carId) !== -1;

            /* Оптимистичное обновление UI */
            btn.disabled = true;
            btn.classList.toggle('active', !isFav);

            /*
             * AJAX POST /api/favourites/{id}  — добавить
             * AJAX DELETE /api/favourites/{id} — убрать
             */
            ajaxFav(
                isFav ? 'DELETE' : 'POST',
                '/api/favourites/' + carId,
                function () {
                    var nowFav = !isFav;
                    if (nowFav) {
                        if (favouriteIds.indexOf(carId) === -1) favouriteIds.push(carId);
                    } else {
                        var idx = favouriteIds.indexOf(carId);
                        if (idx !== -1) favouriteIds.splice(idx, 1);
                    }
                    btn.classList.toggle('active', nowFav);
                    btn.title    = nowFav ? 'Убрать из избранного' : 'Добавить в избранное';
                    btn.disabled = false;
                },
                function (err) {
                    console.error('Ошибка переключения избранного:', err);
                    btn.classList.toggle('active', isFav); /* откат */
                    btn.disabled = false;
                }
            );
        });

        /* ════════════════════════════════════════════
         * Переход на страницу карточки автомобиля
         * ════════════════════════════════════════════ */

        window.goToCarDetails = function (id) {
            window.location.href = 'card.html?id=' + id;
        };


        var BODY_LABELS = {
            sedan:       'Седан',
            hatchback:   'Хэтчбек',
            suv:         'Внедорожник',
            coupe:       'Купе',
            wagon:       'Универсал',
            minivan:     'Минивэн',
            convertible: 'Кабриолет',
            pickup:      'Пикап'
        };

        var FUEL_LABELS = {
            petrol:   'Бензин',
            diesel:   'Дизель',
            hybrid:   'Гибрид',
            electric: 'Электро',
            gas:      'Газ'
        };

        var TX_LABELS = {
            automatic: 'Автомат',
            manual:    'Механика',
            robot:     'Робот',
            variator:  'Вариатор'
        };

        var DRIVE_LABELS = {
            front: 'Передний',
            rear:  'Задний',
            all:   'Полный'
        };


        loadPage(1);

    })();
